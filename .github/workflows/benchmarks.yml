name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[benchmark]"

      - name: Run warm-cache benchmarks
        run: >-
          PYTHONPATH=src python benchmarks/run_benchmarks.py
          --repeats 5 --output benchmark-results.json

      - name: Run cold-cache symbolic benchmarks
        run: >-
          PYTHONPATH=src python benchmarks/run_benchmarks.py
          --cold-cache --repeats 3 --group sos --group moments
          --output benchmark-cold-results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results
          path: |
            benchmark-results.json
            benchmark-cold-results.json
