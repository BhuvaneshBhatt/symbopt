name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install release tools
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify release version matches tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]

          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(
                  f"Release tag {tag!r} does not match package version {version!r}; "
                  f"expected {expected!r}."
              )
          PY

      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv .wheel-test
          .wheel-test/bin/python -m pip install --upgrade pip
          .wheel-test/bin/python -m pip install dist/*.whl
          .wheel-test/bin/python - <<'PY'
          import sympy as sp
          import symbopt

          x = sp.symbols("x", real=True)
          assert symbopt.minval((x - 2) ** 2, variables=[x]) == 0
          assert symbopt.argmin((x - 2) ** 2, variables=[x]) == ({x: 2},)
          assert symbopt.maxval(-(x - 1) ** 2, variables=[x]) == 0
          PY

      - name: Upload release distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/symbopt
    permissions:
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
